[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zk-biometrics"
version = "0.1.0"
description = "Zero-Knowledge Cancelable Biometrics & Fully Homomorphic Encrypted Vector Search (BIPA/GDPR/EU AI Act Compliant)."
readme = "README.md"
authors = [
  { name = "Ahmed Hassan", email = "ahmed@a2zsoc.com" }
]
license = { text = "Apache-2.0" }
keywords = [
  "zero-knowledge-biometrics",
  "homomorphic-encryption",
  "privacy-preserving-face-recognition",
  "bipa-compliance",
  "cancelable-biometrics",
  "encrypted-vector-search",
  "biometric-encryption",
  "gdpr-article-9",
  "secure-enclave-biometrics",
  "zk-snarks-identity",
  "eu-ai-act-biometrics",
  "privacy-enhancing-technologies"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography"
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
zk-biometrics = "zk_biometrics.cli:main"
